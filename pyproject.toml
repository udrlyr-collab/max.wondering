[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moviemax-cgv-monitor"
version = "0.1.0"
description = "CGV screening availability monitor with Telegram and Web Push alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "curl-cffi==0.15.0",
  "fastapi==0.139.2",
  "pywebpush==2.3.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
moviemax = "moviemax.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moviemax = ["web_assets/*", "web_assets/fonts/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
